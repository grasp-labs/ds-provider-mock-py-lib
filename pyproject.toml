[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-provider-mock-py-lib"
version = "0.1.0"
description = "Mock provider for DS pipeline e2e testing"
dependencies = [
    "ds-resource-plugin-py-lib>=0.1.0rc2,<1.0.0",
    "ds-common-logger-py-lib>=0.1.0a5,<1.0.0",
    "ds-common-serde-py-lib>=0.1.0b1,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
keywords = ["ds", "python", "mock", "provider", "e2e"]
authors = [
    {name = "Kristoffer Varslott", email = "hello@grasplabs.com"}
]
maintainers = [
    {name = "Kristoffer Varslott", email = "hello@grasplabs.com"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "PyPI.md"

[project.urls]
Documentation = "https://grasp-labs.github.io/ds-provider-mock-py-lib/"
Repository = "https://github.com/grasp-labs/ds-provider-mock-py-lib/"
Issues = "https://github.com/grasp-labs/ds-provider-mock-py-lib/issues/"
Changelog = "https://github.com/grasp-labs/ds-provider-mock-py-lib/releases"

[project.entry-points."ds.providers"]
mock = "ds_provider_mock_py_lib"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pandas-stubs>=2.0.0",
    "types-pyyaml>=6.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pre-commit>=3.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "sphinx>=7.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-material>=0.0.35",
    "bandit>=1.7.0",
    "jsonschema>=4.20.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "jsonschema>=4.20.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-material>=0.0.35",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ds_provider_mock_py_lib = ["resource.yaml", "py.typed", "schema.dataset.json", "schema.linked_service.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
